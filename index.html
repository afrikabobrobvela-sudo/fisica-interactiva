<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física I - BUAP</title>
    <link rel="stylesheet" href="css/estilos.css">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="index.html" class="logo">
                <img src="img/logo-buap.png" alt="Logo BUAP" class="logo-img">
                BUAP Física
            </a>
            <nav class="nav-links">
                <a href="mcu.html">MCU</a>
                <a href="caida.html">Caída Libre</a>
            </nav>
        </div>
    </header>

    <section style="height: 90vh; display: flex; align-items: center; text-align: center;">
        <div class="container">
            <h1 style="font-size: 3.5rem; margin-bottom: 10px; color: white;">Laboratorio Virtual</h1>
            <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 50px;">
                Material interactivo para la materia <strong>Física I</strong><br>
                Dr. Rodrigo Vela
            </p>
            
            <div class="concept-grid" style="max-width: 800px; margin: 0 auto;">
                <!-- Tarjeta Conversiones -->
                <a href="conversiones.html" class="card" id="card-conv">
                    <i class="fa-solid fa-scale-balanced anim-balanza" style="font-size: 3rem; color: #10b981; margin-bottom: 15px;"></i>
                    <h3>Conversiones</h3>
                    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 10px;">Análisis dimensional y factores de conversión.</p>
                </a>
                <!-- Tarjeta MCU -->
                <a href="mcu.html" class="card" style="text-decoration: none; color: inherit; transition: transform 0.2s;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px; --fa-animation-duration: 3s;"></i>
                    <h3>Movimiento Circular</h3>
                    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 10px;">Velocidad angular, periodo y frecuencia.</p>
                </a>

                <!-- Tarjeta Caída Libre -->
                <a href="caida.html" class="card" style="text-decoration: none; color: inherit; transition: transform 0.2s;">
                    <i class="fa-solid fa-arrow-down fa-bounce" style="font-size: 3rem; color: var(--danger); margin-bottom: 15px;"></i>
                    <h3>Caída Libre</h3>
                    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 10px;">Gravedad y movimiento vertical en el vacío.</p>
                </a>
            </div>
        </div>
    </section>

</body>
</html>
