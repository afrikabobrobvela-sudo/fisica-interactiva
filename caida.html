<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caída Libre - Física I</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="index.html" class="logo"><span>⚡</span> BUAP</a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="mcu.html">MCU</a>
                <a href="caida.html" class="active">Caída Libre</a>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 100px;">
        <section>
            <h1>Caída Libre</h1>
            <p>Experimento de gravedad en vacío ideal.</p>
            
            <div class="sim-wrapper" style="margin-top: 40px;">
                <!-- Lienzo -->
                <div class="canvas-container">
                    <canvas id="caidaCanvas"></canvas>
                </div>

                <!-- Controles -->
                <div class="controls">
                    <div class="control-group">
                        <label>Planeta</label>
                        <select id="sel-planet">
                            <option value="9.81">Tierra (9.81)</option>
                            <option value="1.62">Luna (1.62)</option>
                            <option value="3.71">Marte (3.71)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Altura Inicial: <span id="val-h" style="color: var(--danger)">50 m</span></label>
                        <input type="range" id="range-h" min="10" max="100" value="50">
                    </div>

                    <button id="btn-action" class="btn" style="width: 100%; margin-bottom: 10px;">Soltar Objeto</button>
                    <button id="btn-reset" class="btn" style="width: 100%; background: #334155;">Reiniciar</button>

                    <div class="data-panel">
                        <div class="data-row"><span>Tiempo:</span> <span class="val" id="out-t">0.00 s</span></div>
                        <div class="data-row"><span>Altura:</span> <span class="val" id="out-y">50.00 m</span></div>
                        <div class="data-row"><span>Velocidad:</span> <span class="val" id="out-v">0.00 m/s</span></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/simulacion_caida.js"></script>
</body>
</html>
